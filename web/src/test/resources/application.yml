spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:~/easy-springboot-db;AUTO_SERVER=TRUE
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      enabled: true
  easy:
    security:
      csrf:
        enabled: false
      cors:
        enabled: true
        origins: /**
        methods:
          - POST
          - GET
      filter:
        excluded-urls:
      multipart:
        enabled: true
        file-extensions:
          - jpeg
          - jpg
          - bmp
          - tiff
          - png